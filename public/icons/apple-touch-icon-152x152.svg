<?xml version="1.0" encoding="UTF-8"?>
<svg width="152" height="152" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Enhanced Gradients and Effects -->
  <defs>
    <!-- Primary Background Gradient -->
    <radialGradient id="bgGradient" cx="0.3" cy="0.3" r="1">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </radialGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    
    <!-- Success Gradient -->
    <linearGradient id="successGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    
    <!-- Simple Glow Effect -->
    <filter id="simpleGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
    
    <!-- Simple Shadow -->
    <filter id="simpleShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" stroke="#1e40af" stroke-width="8"/>
  
  <!-- Subtle Background Pattern -->
  <circle cx="256" cy="256" r="235" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="2,4"/>
  
  <!-- Multiple Progress Rings -->
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#60a5fa" stroke-width="8" opacity="0.3" stroke-linecap="round"/>
  
  <!-- Middle Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#3b82f6" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
  
  <!-- Inner Progress Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#34d399" stroke-width="8" 
          stroke-dasharray="280 650" stroke-linecap="round" 
          transform="rotate(-90 256 256)" opacity="0.9"/>
  
  <!-- Achievement Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#accentGradient)" stroke-width="6" 
          stroke-dasharray="180 1000" stroke-linecap="round" 
          transform="rotate(45 256 256)" opacity="0.7"/>
  
  <!-- Inner Background Circle -->
  <circle cx="256" cy="256" r="130" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Enhanced Central G Monogram -->
  <g transform="translate(256, 256)">
    <!-- G Letter Outer Ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#textGradient)" stroke-width="16" opacity="0.9"/>
    
    <!-- G Letter Body - Simplified Path -->
    <path d="M -80 -70 Q -80 -90 -60 -90 L 30 -90 Q 90 -90 90 -30 L 90 30 Q 90 90 30 90 L -60 90 Q -80 90 -80 70 L -80 10 Q -80 -10 -60 -10 L -30 -10 L -30 50 L -60 50 Q -80 50 -80 70 Z" 
          fill="url(#textGradient)" opacity="0.95"/>
    
    <!-- Enhanced G Crossbar -->
    <rect x="35" y="-15" width="50" height="30" fill="url(#textGradient)" rx="6"/>
    
    <!-- Inner G Highlight -->
    <path d="M -70 -60 Q -70 -70 -50 -70 L 10 -70 Q 50 -70 50 -10 L 50 10 Q 50 70 10 70 L -50 70 Q -70 70 -70 50 L -70 0 Q -70 -20 -50 -20 L -20 -20 L -20 40 L -50 40 Q -70 40 -70 50 Z" 
          fill="white" opacity="0.3"/>
  </g>
  
  <!-- Advanced Progress Dots -->
  <g>
    <circle cx="256" cy="86" r="10" fill="url(#accentGradient)"/>
    <circle cx="426" cy="256" r="10" fill="url(#accentGradient)"/>
    <circle cx="256" cy="426" r="10" fill="url(#accentGradient)"/>
    <circle cx="86" cy="256" r="10" fill="url(#accentGradient)"/>
  </g>
  
  <!-- Enhanced Corner Accents -->
  <g>
    <circle cx="110" cy="110" r="8" fill="#60a5fa" opacity="0.8"/>
    <circle cx="402" cy="110" r="8" fill="#34d399" opacity="0.8"/>
    <circle cx="110" cy="402" r="8" fill="#34d399" opacity="0.8"/>
    <circle cx="402" cy="402" r="8" fill="#60a5fa" opacity="0.8"/>
  </g>
  
  <!-- Mini Progress Rings around corners -->
  <g opacity="0.6">
    <circle cx="140" cy="140" r="20" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="15 40" transform="rotate(30 140 140)"/>
    <circle cx="372" cy="140" r="20" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="25 30" transform="rotate(-30 372 140)"/>
    <circle cx="140" cy="372" r="20" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="20 35" transform="rotate(-30 140 372)"/>
    <circle cx="372" cy="372" r="20" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="30 25" transform="rotate(30 372 372)"/>
  </g>
  
  <!-- Enhanced Chart Elements -->
  <g transform="translate(0, 20)">
    <!-- Individual chart bars with gradients -->
    <rect x="160" y="340" width="12" height="40" fill="#fbbf24" rx="4"/>
    <rect x="180" y="330" width="12" height="50" fill="#f59e0b" rx="4"/>
    <rect x="200" y="310" width="12" height="70" fill="#fbbf24" rx="4"/>
    <rect x="220" y="320" width="12" height="60" fill="#f59e0b" rx="4"/>
    <rect x="240" y="295" width="12" height="85" fill="#fbbf24" rx="4"/>
    <rect x="260" y="305" width="12" height="75" fill="#f59e0b" rx="4"/>
    <rect x="280" y="315" width="12" height="65" fill="#fbbf24" rx="4"/>
    <rect x="300" y="325" width="12" height="55" fill="#f59e0b" rx="4"/>
    <rect x="320" y="335" width="12" height="45" fill="#fbbf24" rx="4"/>
    <rect x="340" y="345" width="12" height="35" fill="#f59e0b" rx="4"/>
    
    <!-- Chart baseline -->
    <rect x="155" y="380" width="202" height="3" fill="rgba(255,255,255,0.3)" rx="1.5"/>
    
    <!-- Chart labels -->
    <text x="256" y="400" text-anchor="middle" fill="white" font-size="16" font-family="Arial, sans-serif" font-weight="600" opacity="0.9">PROGRESS</text>
  </g>
  
  <!-- Achievement Badges -->
  <g opacity="0.8">
    <!-- Achievement Star -->
    <path d="M256 120 L264 135 L281 136 L269 147 L273 163 L256 155 L239 163 L243 147 L231 136 L248 135 Z" 
          fill="url(#accentGradient)"/>
    
    <!-- Achievement Ribbon -->
    <path d="M256 75 Q260 80 260 85 Q260 90 256 95 Q252 90 252 85 Q252 80 256 75 Z" 
          fill="url(#accentGradient)"/>
  </g>
  
  <!-- Enhanced Subtitle for Large Icons -->
  <g transform="translate(0, 10)">
    <text x="256" y="465" text-anchor="middle" fill="url(#textGradient)" font-size="24" font-family="Arial, sans-serif" font-weight="600" letter-spacing="2px">GYM TRACKER</text>
    <text x="256" y="485" text-anchor="middle" fill="url(#accentGradient)" font-size="14" font-family="Arial, sans-serif" font-weight="500" letter-spacing="1px">FITNESS &amp; PROGRESS</text>
  </g>
  
  <!-- Subtle energy rays -->
  <g opacity="0.2">
    <path d="M256 40 L256 20" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round"/>
    <path d="M472 256 L492 256" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round"/>
    <path d="M256 472 L256 492" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round"/>
    <path d="M40 256 L20 256" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>